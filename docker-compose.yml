services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: bml_lms
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - bml_db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bml_lms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [data]

  backend:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://bml_app:${DB_PASSWORD}@db:5432/bml_lms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env (hostname only)}
      REQUIRE_OTP: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SNIPPE_BASE_URL: ${SNIPPE_BASE_URL:-}
      SNIPPE_API_KEY: ${SNIPPE_API_KEY:-}
      SNIPPE_WEBHOOK_SECRET: ${SNIPPE_WEBHOOK_SECRET:-}
      SNIPPE_WEBHOOK_URL: ${SNIPPE_WEBHOOK_URL:-}
      BEEM_SMS_API_KEY: ${BEEM_SMS_API_KEY:-}
      BEEM_SMS_API_SECRET: ${BEEM_SMS_API_SECRET:-}
      BEEM_SMS_SENDER_ID: ${BEEM_SMS_SENDER_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [app, data]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env (hostname only)}
        VITE_LOCAL_DEMO_MODE: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [edge, app]

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (hostname only)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

  db-setup:
    profiles: [setup]
    build:
      context: ./backend
      target: production
    command: ["npm", "run", "db:setup:compiled"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bml_app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/bml_lms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

  db-bootstrap-admin:
    profiles: [setup]
    build:
      context: ./backend
      target: production
    command: ["npm", "run", "db:bootstrap-admin:compiled"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bml_app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/bml_lms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BML_BOOTSTRAP_ADMIN_USERNAME: ${BML_BOOTSTRAP_ADMIN_USERNAME:-}
      BML_BOOTSTRAP_ADMIN_NAME: ${BML_BOOTSTRAP_ADMIN_NAME:-}
      BML_BOOTSTRAP_ADMIN_PASSWORD: ${BML_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

  db-disable-legacy-demos:
    profiles: [setup]
    build:
      context: ./backend
      target: production
    command: ["npm", "run", "db:disable-legacy-demos:compiled"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bml_app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/bml_lms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

volumes:
  bml_db:
    external: true
    name: brianna_lms_db_v2
  caddy_data:
  caddy_config:

networks:
  edge:
  app:
  data:
    internal: true
